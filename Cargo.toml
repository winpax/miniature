[package]
edition = "2021"
name = "miniature"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[dependencies]
libc = { version = "0.2" }
windows = { version = "0.57.0", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }
